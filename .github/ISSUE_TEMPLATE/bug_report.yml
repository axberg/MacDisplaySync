name: Bug report
description: Report a reproducible MacDisplaySync problem
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Please avoid raw VCP writes while collecting diagnostics.
  - type: input
    id: mac
    attributes:
      label: Mac and macOS
      placeholder: MacBook Pro M1 Max, macOS 15.6.1
    validations:
      required: true
  - type: input
    id: monitor
    attributes:
      label: Monitor and connection
      placeholder: LG 49WL95C over USB-C to DisplayPort
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
