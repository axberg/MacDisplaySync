name: Build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check and package app
        run: make package
      - uses: actions/upload-artifact@v4
        with:
          name: MacDisplaySync-macos-arm64
          path: dist/*.zip
          if-no-files-found: error
